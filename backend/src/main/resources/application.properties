# ===============================
# APP INFO
# ===============================
spring.application.name=ai-health-habit-tracker

# ===============================
# DATABASE (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/healthhabitdb?useSSL=false&serverTimezone=UTC
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# ===============================
# SUPABASE JWT SECRET
# (Add your Supabase project's JWT secret here)
# ===============================
supabase.jwt.secret=${JWT_SECRET}

# ===============================
# CORS / FRONTEND CONFIG
# ===============================
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=Authorization,Content-Type

# ===============================
# OPENAI CONFIG
# ===============================
# Provide your OpenAI API key via environment variable or .env file
openai.api.key=${OPENAI_API_KEY}

# ===============================
# WEB PUSH (VAPID KEYS)
# ===============================
# These should also be environment variables in production
vapid.public.key=${VAPID_PUBLIC_KEY}
vapid.private.key=${VAPID_PRIVATE_KEY}
